name: Validate playbooks

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/validate-templates.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Render example chart
        run: |
          node -e 'process.stdout.write(JSON.stringify(require("./playbooks/planning/business-plan/example.json").financials))' > financials.json
          python charts/render_chart.py --kind mermaid-xy --data financials.json --currency USD --out financials.png
          test -s financials.png

  tag-versions:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag new template versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(node -e 'for (const t of require("./catalog.json").templates) console.log(`${t.id}-v${t.version}`)'); do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag -a "$tag" -m "$tag"
              git push origin "$tag"
            fi
          done
